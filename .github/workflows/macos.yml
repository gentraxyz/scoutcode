# Builds a universal (Apple silicon + Intel) .dmg for Mac users. Run by hand; publishes nothing, the .dmg is an
# artifact of the run. It's ad-hoc signed, not notarized, so the first open needs right-click > Open.
name: macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # Bundling is off in tauri.conf.json because Windows ships a bare exe; it's turned on here for the .dmg only.
      - name: Build the .dmg
        run: >
          npx --prefix ui tauri build --target universal-apple-darwin --bundles dmg
          --config '{"bundle":{"active":true,"macOS":{"signingIdentity":"-","minimumSystemVersion":"11.0"}}}'

      - uses: actions/upload-artifact@v5
        with:
          name: Scout-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
