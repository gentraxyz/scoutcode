<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --bg: #0e0f13;
        --surface: #16171c;
        --line: #24262e;
        --text: #e8e9ee;
        --muted: #8a8e9b;
        --accent: #4d6bfe;
        --green: #34c38f;
        --red: #f0616d;
        --amber: #f2b84b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body { font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; width: 300px; padding: 14px; }

      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .logo { width: 30px; height: 30px; flex: none; border-radius: 8px; }
      .title { flex: 1; min-width: 0; }
      .title b { display: block; font-size: 14px; font-weight: 600; }
      .title span { color: var(--muted); font-size: 12px; }

      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 11px;
        font-weight: 600; background: #1d1f26; color: var(--muted); white-space: nowrap; }
      .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .pill.ok { color: var(--green); background: rgba(52, 195, 143, .12); }
      .pill.bad { color: var(--red); background: rgba(240, 97, 109, .12); }
      .pill.wait { color: var(--amber); background: rgba(242, 184, 75, .12); }
      .pill.wait::before { animation: pulse 1.2s ease-in-out infinite; }

      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
      .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; }
      .row + .row { border-top: 1px solid var(--line); }
      .row .text { flex: 1; min-width: 0; }
      .row .text b { display: block; font-weight: 500; }
      .row .text span { color: var(--muted); font-size: 12px; }

      .state { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
      .state svg { width: 18px; height: 18px; }
      .state.ok { color: var(--green); }
      .state.bad { color: var(--red); }
      .state.idle::after { content: ''; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #4a4d58; }
      .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2c2f38; border-top-color: var(--accent);
        animation: spin .7s linear infinite; }

      .banner { display: none; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
        font-size: 12px; }
      .banner.show { display: flex; }
      .banner.work { background: rgba(77, 107, 254, .1); color: #b8c4ff; }
      .banner.error { background: rgba(240, 97, 109, .1); color: #ffb3b9; align-items: flex-start; }
      .banner.error .spin { border-top-color: var(--red); margin-top: 1px; }

      button { display: none; width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; font: inherit;
        font-weight: 600; color: #fff; background: var(--accent); cursor: pointer; }
      button.show { display: block; }
      button:hover { background: #5f7bff; }

      footer { margin-top: 12px; color: var(--muted); font-size: 11.5px; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <header>
      <svg class="logo" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#4D6BFE"/><path fill="#fff" d="M19.6 8.3c-.3-.1-.5.1-.7.3l-.2.2c-.4.4-.9.7-1.5.7-.9 0-1.6.3-2.2.9-.1-.8-.5-1.2-1.2-1.5-.4-.2-.7-.4-1-.7-.2-.3-.2-.6-.3-.9 0-.2 0-.4-.3-.4-.2 0-.3.2-.4.4-.4.7-.5 1.5-.5 2.3.1 1.8.8 3.2 2.3 4.2.2.1.2.2.2.4l-.3 1c-.1.2-.1.3-.4.2-.8-.4-1.5-.9-2.1-1.5-1-1-1.9-2.1-3.1-2.9l-.8-.5c-1.1-1.1.1-2 .4-2.1.3-.1.1-.5-.9-.5S4.6 8.7 4.3 8.8c-.4-.1-.8-.1-1.3-.1-.6 0-1.1.2-1.6.4.7-.1.5.4.4.6-.3.9-.2 2.1.2 3.1.6 1.6 1.7 2.9 3.2 3.9 1.6 1.1 3.4 1.4 5.3 1.3 1.1-.1 2.4-.2 3.9-1.5.4.2.8.2 1.4.2.5 0 .9-.1 1.2-.1.5-.1.5-.6.3-.7-1.5-.7-1.2-.4-1.5-.6.7-.9 1.8-1.8 2.3-4.7 0-.2 0-.4.1-.4.3-.1.7-.1 1.1 0 .9.5 1.8.1 1.9-.5 0-.5-.6-.9-1.6-1.4z"/></svg>
      <div class="title"><b>Scout for DeepSeek</b><span id="summary">Checking…</span></div>
      <span id="pill" class="pill wait">…</span>
    </header>

    <div class="card">
      <div class="row">
        <div class="text"><b>Scout desktop app</b><span id="scout-text">Looking for Scout…</span></div>
        <div id="scout" class="state"><div class="spin"></div></div>
      </div>
      <div class="row">
        <div class="text"><b>DeepSeek tab</b><span id="tab-text">Looking for a tab…</span></div>
        <div id="tab" class="state"><div class="spin"></div></div>
      </div>
    </div>

    <div id="work" class="banner work"><div class="spin"></div><span id="work-text">Running a request from Scout</span></div>
    <div id="error" class="banner error"><div class="spin"></div><span id="error-text"></span></div>
    <button id="open"></button>

    <footer>Keep a chat.deepseek.com tab open while Scout uses DeepSeek Web.</footer>
    <script src="popup.js"></script>
  </body>
</html>
