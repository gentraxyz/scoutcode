# Builds the Linux app for a release, on GitHub's runners. scripts/release.ts starts it with `gh workflow run`, waits for
# it, downloads the builds and signs them on the releasing PC with the others, so no keys or secrets live here. It
# publishes nothing itself. Built on Ubuntu 22.04 so it runs on that and anything newer (glibc 2.35, WebKitGTK 4.1).
name: Linux build
run-name: Linux build ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The scout commit this release is, signed into the release and shown in Settings
        required: true
      ref:
        description: The commit of this repo to build, whose files are that commit's gui/
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the Linux libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libxdo-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The UI is built into the binary, so it has to exist before cargo builds anything.
      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build the app
        env:
          SCOUT_COMMIT: ${{ inputs.commit }}
        run: |
          cargo build --release
          mkdir out
          cp target/release/scout-desktop out/scout

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/scout
          if-no-files-found: error
          retention-days: 7
