# Builds the Mac app for a release, on GitHub's runners, as linux.yml does for Linux. scripts/release.ts starts it with
# `gh workflow run`, waits for it, downloads the builds and signs them on the releasing PC with the others, so no keys or
# secrets live here. It publishes nothing itself. Each build is the bare program, ad-hoc signed by the linker; the site's
# /install.sh puts it in a Scout.app, and the app updates that program in place from then on. macOS 11 and newer.
name: macOS build
run-name: macOS build ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The scout commit this release is, signed into the release and shown in Settings
        required: true
      ref:
        description: The commit of this repo to build, whose files are that commit's gui/
        required: true

permissions:
  contents: read

jobs:
  # Both Macs build on one runner, one after the other: Apple's tools cross-compile either way, and GitHub's macOS
  # runners can queue for a long time, so asking for one is quicker than asking for two.
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      # The UI is built into the binary, so it has to exist before cargo builds anything.
      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build the app
        env:
          SCOUT_COMMIT: ${{ inputs.commit }}
        run: |
          for pair in macos-aarch64:aarch64-apple-darwin macos-x86_64:x86_64-apple-darwin; do
            platform=${pair%%:*}
            target=${pair#*:}
            cargo build --release --target "$target"
            mkdir -p "out/$platform"
            cp "target/$target/release/scout-desktop" "out/$platform/scout"
            codesign --force --sign - "out/$platform/scout"
            file "out/$platform/scout"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: out/macos-aarch64/scout
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: out/macos-x86_64/scout
          if-no-files-found: error
          retention-days: 7
