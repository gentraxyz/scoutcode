[package]
name = "scout-desktop"
version = "0.1.25"
edition = "2024"
description = "Scout: a desktop coding agent for ScoutCode (scoutcode.dev)"
license = "MIT"
publish = false

[features]
# `tauri dev` turns this off to load the UI from Vite.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "scout-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
rfd = "0.17"
sha2 = "0.10"
# Checks that an update was signed by ScoutCode before it's installed.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
getrandom = "0.3"
portable-pty = "0.9"
# Voice input: mic capture (transcribed by Deepgram through the server).
cpal = "0.18"
# GitHub Copilot. Pinned: the runtime Scout downloads must be this same version (VERSION in src/copilot.rs). Without the
# default "bundled-cli" feature, the runtime stays out of Scout's binary.
github-copilot-sdk = { version = "=1.0.28", default-features = false, features = ["runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
# Devin's CLI comes as a zip on Windows.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Attached images are checked, and shrunk when they're too big to send.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Grok Build's CLI comes compressed with Brotli.
brotli-decompressor = "5"

[target.'cfg(windows)'.dependencies]
# For toast notifications and dynamic taskbar icon. UI Automation, input and process names: the Claude connector setup
# working the browser itself (claude_native.rs). The PC's memory: how much of it llama.cpp may keep prompts in (local.rs).
# The registry also says how much memory the GPU has: which local model fits (local.rs).
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# install.ps1's build for this PC: as optimized as a release, without LTO and with incremental builds, so a change
# rebuilds in seconds. Releases to users still use `release`.
[profile.local]
inherits = "release"
lto = false
incremental = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
tauri-build = { version = "2", features = [] }
