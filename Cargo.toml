[package]
name = "scout-desktop"
version = "0.1.0"
edition = "2024"
description = "Scout: a native desktop coding agent for ScoutCode (scoutcode.dev)"
license = "UNLICENSED"
publish = false

[[bin]]
name = "scout-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wgpu", "glow", "x11", "wayland"] }
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
rfd = "0.17"
sha2 = "0.10"
# Checks that an update was signed by ScoutCode before it's installed.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
getrandom = "0.3"
portable-pty = "0.9"
vt100 = "0.16"
# Voice input: mic capture (transcribed by Deepgram through the server).
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
# Already built for the window; these features add toast notifications.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
