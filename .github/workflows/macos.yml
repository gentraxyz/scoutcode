# Builds the Mac app for a release, on GitHub's runners, as linux.yml does for Linux. scripts/release.ts starts it with
# `gh workflow run`, waits for it, downloads the builds and signs them on the releasing PC with the others, so no keys or
# secrets live here. It publishes nothing itself. Each build is the bare program, ad-hoc signed by the linker; the site's
# /install.sh puts it in a Scout.app, and the app updates that program in place from then on. macOS 11 and newer.
name: macOS build
run-name: macOS build ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The scout commit this release is, signed into the release and shown in Settings
        required: true
      ref:
        description: The commit of this repo to build, whose files are that commit's gui/
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-aarch64
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      # The UI is built into the binary, so it has to exist before cargo builds anything.
      - name: Build the UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Build the app
        env:
          SCOUT_COMMIT: ${{ inputs.commit }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir out
          cp target/${{ matrix.target }}/release/scout-desktop out/scout
          codesign --force --sign - out/scout
          file out/scout

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/scout
          if-no-files-found: error
          retention-days: 7
